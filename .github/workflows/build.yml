name: build

# main  → images :latest + :<sha>, APK and web as workflow artifacts
# v*.*.* tag → also images :<version> and a GitHub Release with the APK and the web bundle
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}   # ghcr.io/avunity/a-fatura → -api / -web

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test backend/AFatura.sln -c Release --logger "console;verbosity=normal"

  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TASK=assembleDebug; FLAVOR=debug
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then TASK=assembleRelease; FLAVOR=release; fi
          gradle -p mobile :composeApp:$TASK -PappVersionCode=${GITHUB_RUN_NUMBER} -PappVersionName=${{ steps.v.outputs.name }} --no-daemon
          mkdir -p dist
          cp "$(find mobile/composeApp/build/outputs/apk/$FLAVOR -name '*.apk' | head -1)" dist/a-fatura.apk
          echo "APK ($FLAVOR) $(du -h dist/a-fatura.apk | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/a-fatura.apk
          retention-days: 30

  ios:
    name: App iOS (compilação)
    runs-on: macos-latest
    # Verifies the shared + iOS code compiles. An installable .ipa needs an Apple Developer account,
    # the iosApp Xcode project and signing secrets (see docs/CI-CD.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p mobile :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon

  images:
    name: Imagens Docker (API + Web)
    needs: [backend, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: APK inside the web image (/downloads/a-fatura.apk)
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: frontend/public/downloads
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: INSTALL_CLAUDE_CLI=true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  web-bundle:
    name: Web (bundle estático)
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: frontend/public/downloads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - run: cd frontend/dist && zip -qr ../../a-fatura-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: a-fatura-web.zip
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, web-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/a-fatura.apk
            dist/a-fatura-web.zip
          body: |
            Imagens Docker: `${{ env.IMAGE_PREFIX }}-api:${{ github.ref_name }}` e `${{ env.IMAGE_PREFIX }}-web:${{ github.ref_name }}` (sem o "v").
            Na VPS: `IMAGE_TAG=<versão>` no `.env` → `./deploy/update.sh`.
