# Host nginx vhost for fatura.avunity.com → A-Fatura web container (127.0.0.1:8095)
# sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/fatura.avunity.com
# sudo ln -s /etc/nginx/sites-available/fatura.avunity.com /etc/nginx/sites-enabled/
# sudo certbot --nginx -d fatura.avunity.com && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name fatura.avunity.com;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
